<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGORWY Cipher</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #101827; color: #f4f6fa; }
    main { max-width: 760px; margin: 60px auto; padding: 24px; }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    p { color: #b9c5d7; line-height: 1.7; }
    textarea { box-sizing: border-box; width: 100%; min-height: 160px; background: #1d293b; color: white; border: 1px solid #526078; border-radius: 10px; padding: 14px; font: inherit; }
    button { margin-top: 12px; padding: 12px 18px; border: 0; border-radius: 8px; background: #e5edf9; color: #111827; font-weight: 700; cursor: pointer; }
    #status { margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>BGORWY Cipher</h1>
    <p>ルービックキューブの27座標を使った暗号化・復号化ツール</p>
    <label for="message">入力テキスト</label>
    <textarea id="message" placeholder="ここにテキストを入力してください"></textarea>
    <button id="test">動作確認</button>
    <p id="status" role="status">サイトの準備ができました。</p>
  </main>
  <script>
    document.getElementById('test').addEventListener('click', () => {
      document.getElementById('status').textContent = '入力文字数: ' + document.getElementById('message').value.length;
    });
  </script>
</body>
</html>
